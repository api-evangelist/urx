name: URX *
description: 'URX was a San Francisco mobile deep-linking and app-search startup that connected
  mobile users to relevant in-app commerce experiences. Backed by roughly $15M from investors
  including GV (Google Ventures) and CyberAgent, it was acquired by Pinterest in May 2016 and its
  product was wound down. The urx.com domain is now parked and listed for sale on a domain
  marketplace, and no API, developer portal, or public developer artifacts remain. Profiled in the
  API Evangelist network as a historical GV portfolio company.'
